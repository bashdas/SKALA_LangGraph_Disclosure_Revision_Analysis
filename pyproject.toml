[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "disclosure-impact-agent"
version = "0.2.0"
description = "Track how corrected Korean contract disclosures affect analysis memos"
requires-python = ">=3.11"
dependencies = [
  "gradio==6.27.0",
  "langgraph==1.2.11",
  "langchain-core==1.6.3",
  "openai==3.14.0",
  "pydantic==2.13.5",
  "python-dotenv==1.2.3",
]

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
